<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ticket Extractor</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 12px; min-width: 200px; }
      .button-row { display: flex; flex-direction: column; gap: 8px; }
      button { 
        padding: 8px 12px; 
        width: 100%;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        font-size: 14px;
      }
      button:hover {
        background: #f5f5f5;
      }
      button:active {
        background: #e0e0e0;
      }
      button.primary {
        background: #0060df;
        color: white;
        border-color: #0060df;
      }
      button.primary:hover {
        background: #0050c5;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status { 
        margin-top: 12px; 
        font-size: 12px; 
        color: #333; 
        white-space: pre-wrap;
        min-height: 20px;
      }
      .success { color: #008000; }
      .error { color: #d13212; }
    </style>
  </head>
  <body>
    <div class="button-row">
      <button id="copyBtn" class="primary">Copy to Clipboard</button>
      <button id="downloadJsonBtn">Download JSON</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
